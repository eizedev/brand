# A minimal site that uses the design; the CI builds it with the action, and it is the starting
# point for a new project's zensical.toml.
[project]
site_name = "example"
site_description = "Example site with the eizedev design"
site_url = "https://example.eize.dev/"
repo_url = "https://github.com/eizedev/brand"
repo_name = "eizedev/brand"
copyright = "Example"
extra_css = ["assets/site.css"]
nav = [{ "Overview" = "index.md" }]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
# Fonts come from the system; nothing is loaded from Google.
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
