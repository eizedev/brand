name: eizedev docs site
description: Build a Zensical documentation site with the eizedev design; the site lands in site/.
inputs:
  working-directory:
    description: Directory that holds zensical.toml and docs/.
    default: "."
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Add the design
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mkdir -p docs/assets && cp "$GITHUB_ACTION_PATH/site.css" docs/assets/site.css
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run --no-project --with-requirements "$GITHUB_ACTION_PATH/requirements.txt" zensical build --strict --clean
