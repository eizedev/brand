version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/docs-site"]
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before proposing a freshly published version.
      default-days: 7
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "pip"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
